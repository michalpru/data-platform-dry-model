# Template: DRY Artifact Manifest
# Declares artifact identity, ownership, lifecycle, registry intent, interfaces,
# dependencies, and physical implementations.

apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: finance.reporting.revenue_events.v1
  title: Revenue Events
  description: Canonical revenue events dataset for finance reporting.
  owner:
    team: finance-analytics
    slack: "#finance-data"
    escalation: finance-data-oncall
  lifecycle:
    state: certified # local | shared | certified | deprecated | retired
    certifiedSince: null
  registry:
    publish: true
    # An artifact may expose more than one interface (e.g. a table-valued UDF is
    # callable logic but consumed as a queryable dataset). See whitepaper §3.1.
    interfaceTypes:
      - queryable_dataset
spec:
  dryLayer:
    - logic
    - physical_data_assets
  physicalImplementations:
    - system: warehouse
      env: prod
      ref: "analytics.finance.revenue_events"
    - system: warehouse
      env: uat
      ref: "analytics_uat.finance.revenue_events"
  compatibility:
    policy: "backward-compatible" # applies to the interface(s) declared above
    deprecationWindowDays: 90
  dependencies:
    declared:
      - fqn: finance.raw.orders.v1
        relationship: source_input
      - fqn: finance.raw.invoices.v1
        relationship: source_input
      - fqn: enterprise.reporting.customer.v1
        relationship: joins_on_customer_id
  links:
    sourceRepo: "https://github.com/your-org/your-repo"
    docs: "./README.md"
