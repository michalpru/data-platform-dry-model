apiVersion: dry.platform/v1
kind: DatasetContract
metadata:
  fqn: finance.reporting.arpac_components.v1
  title: "ARPAC Components Dataset"
  description: >
    Per-customer components dataset for the trailing-90-day ARPAC metric.
    Grain: customer_id × reporting_date, restricted to active customers
    (is_active_commercial_90d = TRUE per sales.datasets.commercial_customer_status_90d.v1).
    Net recognized revenue is sourced exclusively from finance.logic.recognize_revenue.v1;
    revenue from non-active customers is excluded by construction.
  owner:
    team: finance-analytics
    escalation: finance-data-oncall
  lifecycle:
    state: certified
  registry:
    publish: true
    interfaceType: queryable_dataset

spec:
  grain:
    - customer_id
    - reporting_date
  materialization:
    type: view
    refreshMode: on_demand
  schema:
    - name: customer_id
      type: number(38,0)
      nullable: false
      description: "Canonical customer identifier from sales.datasets.commercial_customer_status_90d.v1."
    - name: reporting_date
      type: date
      nullable: false
      description: "The as-of date. The trailing 90-day window is [reporting_date - 89, reporting_date] inclusive."
    - name: net_recognized_revenue_usd
      type: number(18,2)
      nullable: false
      description: "Net recognized revenue in USD for this active customer in the 90-day window. Refunds are netted by finance.logic.recognize_revenue.v1. Zero for active customers with no revenue events in the window."
  compatibility:
    policy: backward-compatible
    deprecationWindowDays: 90

  dependencies:
    - fqn: sales.datasets.commercial_customer_status_90d.v1
      relationship: source_input
      note: "Denominator population — enterprise active-customer definition (certified by sales-analytics)."
      cross_engine_gap: true
      gap_detail: >
        sales.datasets.commercial_customer_status_90d.v1 is certified (enterprise_canonical)
        but has no Snowflake binding — it is bound only to Databricks (runtime: databricks,
        ref: sales.datasets.commercial_customer_status_90d). A Snowflake (warehouse) binding
        must be provisioned (e.g., Snowflake external table, Delta Sharing, or a registered
        mirror view) before this dataset can be deployed to the warehouse runtime.
        DO NOT re-derive the active-customer logic locally.

    - fqn: finance.logic.recognize_revenue.v1
      relationship: transformation_dependency
      note: "Numerator source — certified net recognized revenue (USD), owned by finance-analytics."
      binding_used:
        runtime: warehouse
        dialect: snowflake
        ref: FINANCE.LOGIC.RECOGNIZE_REVENUE
        object_type: udf

  semanticGovernance:
    transformationLogic: >
      Active customers are those where is_active_commercial_90d = TRUE for the given reporting_date,
      sourced from sales.datasets.commercial_customer_status_90d.v1.
      Revenue is the SUM of RECOGNIZED_REVENUE_USD returned by FINANCE.LOGIC.RECOGNIZE_REVENUE
      over the 90-day window [reporting_date - 89 days, reporting_date] (inclusive), joined to
      active customers only via CUSTOMER_ID. Revenue from non-active customers is excluded.
      Active customers with zero revenue events in the window receive net_recognized_revenue_usd = 0
      and still count in the ARPAC denominator.
    grainOwnership: >
      Each row represents one active customer as of reporting_date with their trailing-90-day
      net revenue contribution. Grain is owned by finance-analytics.
    semanticBreakingChanges:
      - change: active-customer filter population altered (is_active_commercial_90d logic changed)
        breaking: true
        reason: ARPAC denominator count and numerator revenue both change
      - change: revenue recognition window boundaries changed
        breaking: true
        reason: ARPAC numerator values change across historical periods
      - change: non-active-customer revenue included
        breaking: true
        reason: violates the ARPAC business definition
