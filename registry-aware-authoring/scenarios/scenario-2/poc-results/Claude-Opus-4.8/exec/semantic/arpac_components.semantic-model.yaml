apiVersion: dry.platform/v1
kind: SemanticModel
metadata:
  fqn: exec.semantic.arpac_components.v1
  title: ARPAC Components semantic model
  description: >
    Semantic model over the ARPAC components dataset. Defines the two measures ARPAC composes —
    net recognized revenue (USD) and the distinct active-customer count — at reporting_date grain.
  owner:
    team: exec-analytics
    escalation: exec-reporting-oncall
  lifecycle:
    state: local # promote after owner review
  registry:
    publish: true
    interfaceType: semantic_contract
spec:
  entity:
    name: ArpacComponent
    grain: reporting_date, customer_id
  sourceDataset: exec.reporting.arpac_active_customer_revenue_90d.v1
  dimensions:
    - name: reporting_date
      type: date
    - name: customer_id
      type: number
  measures:
    - name: net_recognized_revenue_usd_90d
      type: sum
      expr: recognized_revenue_usd_90d
    - name: active_customers_90d
      type: count_distinct
      expr: customer_id
  compatibility:
    policy: backward-compatible
