# DRY Artifact manifest (registry = logical metadata index; no code stored here).
#
# Registry scope: this is a RETIRED legacy artifact, kept in the registry on purpose so that
# registry-aware authoring can *reject* it. Workspace similarity search (scenario 1B) surfaces the
# legacy invoice_revenue view as "reusable" with no lifecycle signal; the registry is the only
# place that records it was superseded and must not be reused for new reporting.
apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: finance.datasets.invoice_revenue.v1
  title: Invoice Revenue (Legacy)
  description: >
    Retired legacy revenue view. Computed customer revenue only from POSTED invoices with currency
    normalization, but skipped refunds/credit notes and applied no revenue-recognition-timing
    rules. Superseded by the certified recognized-revenue path
    (finance.datasets.fact_billable_events.v1 -> finance.logic.recognize_revenue.v1). Retained for
    lineage only; do NOT reuse.
  owner:
    team: finance-analytics
    escalation: finance-data-oncall
  lifecycle:
    state: retired
    retiredSince: "2024-11"
    supersededBy: finance.logic.recognize_revenue.v1
spec:
  entryRole: producer
  interfaceTypes:
    - queryable_dataset
  reuseIntent: domain_canonical
  implementationBindings:
    - system: warehouse
      env: prod
      objectType: view
      dialect: snowflake
      ref: FINANCE.DATASETS.INVOICE_REVENUE
      attributionKey: "warehouse:snowflake:FINANCE.DATASETS.INVOICE_REVENUE"
      source: finance/datasets/invoice_revenue.sql
  compatibility:
    policy: frozen
    note: >
      No further changes. This artifact exists to be discoverable-and-rejected: the registry
      records its retired lifecycle so consumers reuse the certified recognized-revenue path.
  dependencies:
    - fqn: shared.datasets.fact_invoices.v1
      relationship: source_input
    - fqn: finance.logic.normalize_currency.v1
      relationship: transformation_dependency
  knownConsumers: []
