# DRY Artifact manifest (registry = logical metadata index; no code stored here).
#
# ONE logical identity with TWO Snowflake-stack bindings: a native SQL table function and a dbt
# macro that reuses the exact same rule. The registry records they are the same certified
# capability, so reuse via dbt is not mistaken for duplication.
apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: finance.logic.normalize_currency.v1
  title: Normalize Currency
  description: >
    Finance currency rule: convert an amount from its source currency to a target (reporting)
    currency using the daily FX rate as-of the conversion date. Centralizes FX source, join grain
    and rounding convention.
  owner:
    team: finance-analytics
    escalation: finance-data-oncall
  lifecycle:
    state: shared
spec:
  entryRole: producer
  interfaceTypes:
    - callable_logic
  reuseIntent: shared_utility
  implementationBindings:
    - system: warehouse
      env: prod
      objectType: function
      dialect: snowflake
      ref: FINANCE.LOGIC.NORMALIZE_CURRENCY
      attributionKey: "warehouse:snowflake:FINANCE.LOGIC.NORMALIZE_CURRENCY"
      source: finance/logic/normalize_currency.sql
    - system: dbt
      env: prod
      objectType: macro
      dialect: snowflake
      ref: dry_finance_macros.normalize_currency
      attributionKey: "dbt:dry_finance_macros.normalize_currency"
      source: finance/logic/dbt/normalize_currency.sql
  compatibility:
    policy: backward-compatible
    breakingChanges:
      - fx_source_table_change
      - rounding_convention_change
  dependencies:
    - fqn: finance.datasets.dim_exchange_rates.v1
      relationship: source_input
  knownConsumers:
    - fqn: finance.logic.recognize_revenue.v1
      relationship: transformation_dependency
    - fqn: finance.datasets.invoice_revenue.v1
      relationship: transformation_dependency
