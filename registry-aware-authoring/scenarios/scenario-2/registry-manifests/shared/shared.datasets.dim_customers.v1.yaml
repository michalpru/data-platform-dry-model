# DRY Artifact manifest (registry = logical metadata index; no code stored here).
# The Implementation Binding's `source` points to the real DDL in the mocked workspace root
# (registry-aware-authoring/scenarios/scenario-2/workspace/), which the comparison engine reads to fingerprint.
apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: shared.datasets.dim_customers.v1
  title: Customer Dimension
  description: >
    Central customer dimension in the shared data warehouse. Carries an operational IS_ACTIVE
    12-month order-activity flag that is NOT the certified executive active-customer definition
    (that is sales.datasets.commercial_customer_status_90d.v1).
  owner:
    team: platform-dwh
    escalation: dwh-data-oncall
  lifecycle:
    state: certified
spec:
  entryRole: producer
  interfaceTypes:
    - queryable_dataset
  reuseIntent: shared_utility
  implementationBindings:
    - system: warehouse
      env: prod
      objectType: table
      dialect: snowflake
      ref: SHARED.DATASETS.DIM_CUSTOMERS
      attributionKey: "warehouse:snowflake:SHARED.DATASETS.DIM_CUSTOMERS"
      source: dwh/shared/datasets/dim_customers.sql
  compatibility:
    policy: backward-compatible
  dependencies: []
  knownConsumers:
    - fqn: sales.datasets.commercial_customer_status_90d.v1
      relationship: source_input
