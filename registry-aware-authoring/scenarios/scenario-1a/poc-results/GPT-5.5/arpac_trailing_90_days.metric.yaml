metric: arpac_trailing_90_days_usd
display_name: Trailing 90 Day ARPAC USD
description: Average Revenue per Active Customer for executive reporting over the trailing 90 days.
grain: one row per metric_as_of_date
formula: net_recognized_revenue_usd / active_customer_count
window:
  type: trailing
  length_days: 90
  end_date: CURRENT_DATE
numerator:
  name: net_recognized_revenue_usd
  definition: Posted invoice revenue in USD minus approved refunds in USD over the trailing 90 days, restricted to active customers.
  invoice_source: shared.fact_invoices
  invoice_filters:
    - invoice_status = 'POSTED'
    - currency_code = 'USD'
    - invoice_date between DATEADD(day, -90, CURRENT_DATE) and CURRENT_DATE inclusive
  refund_source: shared.fact_refunds
  refund_filters:
    - refund_status = 'APPROVED'
    - currency_code = 'USD'
    - refund_date between DATEADD(day, -90, CURRENT_DATE) and CURRENT_DATE inclusive
  customer_scope: Only customers present in the active-customer denominator are included.
denominator:
  name: active_customer_count
  definition: Distinct count of customers where shared.dim_customers.is_active = TRUE.
  source: shared.dim_customers
  filter: is_active = TRUE
dependencies:
  - shared.dim_customers
  - shared.fact_invoices
  - shared.fact_refunds
output:
  sql_file: arpac_trailing_90_days.sql
  view_name: shared.metric_arpac_trailing_90_days
  columns:
    - metric_as_of_date
    - net_recognized_revenue_usd
    - active_customer_count
    - arpac_trailing_90_days_usd
reuse_notes:
  - Reuses shared.dim_customers.is_active as the active-customer definition used by executive dashboards in this workspace.
  - Reuses shared.fact_invoices as the recognized revenue source, with POSTED invoices treated as recognized revenue.
  - Reuses shared.fact_refunds as the refund source, with APPROVED refunds reducing recognized revenue.
assumptions:
  - USD revenue is identified by currency_code = 'USD'; no FX conversion table exists in the allowed workspace scope.
  - Refunds are attributed to customers by joining shared.fact_refunds.invoice_id to shared.fact_invoices.invoice_id.
  - The metric returns NULL when there are zero active customers to avoid division by zero.