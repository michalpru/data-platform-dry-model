# Registered callable_logic artifact — platform-owned SQL macro package.
# Registered by: data-platform team on publishing v0.1.0 to the internal package registry.
# Source: platform/packages/sql/dry_shared_macros/
#
# Domain teams declare this as a versioned package dependency in packages.yml.
# They do not copy macro source into their own projects.
# See usage: domains/finance/dependencies/packages.yml, domains/marketing/dependencies/packages.yml

apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: platform.callable.dry_shared_macros.v1
  title: DRY Shared Macros
  description: >
    Platform-published SQL macro package providing business-agnostic SQL macro helpers.
    Domain teams declare a versioned package dependency — they do not copy macro source.

    Currently exposes:
      - with_boolean_flag(column_expr, true_expr, false_expr)
        Renders a CASE WHEN expression for boolean flag computation.
        Encodes *how* to compute a flag, not *what* the flag means.
        Example usage (marketing dataset):
          {{ with_boolean_flag('c.last_activity_date >= DATEADD(day, -30, CURRENT_DATE)', 'is_active_30d') }}

    Corresponds to the "DRY in Code" layer: SQL-level technical utilities that are
    business-agnostic and reusable across any domain that uses SQL transformations.
  owner:
    team: data-platform
    escalation: platform-oncall
  lifecycle:
    state: shared
    sharedSince: "2025-01"

spec:
  entryRole: producer
  reuseIntent: shared_utility
  interfaceTypes:
    - callable_logic
  distribution:
    type: sql_macro_package
    registry: internal-package-registry
    package: dry_shared_macros
    currentVersion: "0.1.0"
    installExample: |
      # packages.yml
      packages:
        - git: "https://github.com/your-org/dry-platform-packages"
          subdirectory: "platform/packages/sql/dry_shared_macros"
          revision: "v0.1.0"
  compatibility:
    policy: semver
    note: >
      Adding new macros is non-breaking.
      Changing the signature of an existing macro (parameter names, count, or order)
      is a breaking change and requires a new major version with migration notice.
  knownConsumers:
    - fqn: finance.reporting.revenue_events.v1
      relationship: transformation_dependency
    - fqn: marketing.reporting.active_customers_30d.v1
      relationship: transformation_dependency
  sourceManifest: platform/packages/sql/dry_shared_macros/package.yaml
