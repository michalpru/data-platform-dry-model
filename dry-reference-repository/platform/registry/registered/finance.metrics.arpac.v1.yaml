      env: prod
      objectType: metric_definition
      ref: semantic.metrics.arpac
      attributionKey: "metric:arpac"
  compatibility:
    policy: backward-compatible
  # Declared Dependencies resolved to logical identities for impact analysis.
  dependencies:
    - fqn: finance.metrics.net_recognized_revenue.v1
      relationship: ratio_numerator
    - fqn: enterprise.metrics.active_customer.v1
      relationship: ratio_denominator
  sourceManifest: domains/finance/semantics/metrics/finance.metrics.arpac.v1.yaml
