# Registered by CI on merge to main.
# Promoted from: domains/finance/logic/finance.logic.recognize_revenue.v1.yaml
#
# Registry scope: certified callable logic intended for reuse beyond the owning team.
# Ownership: Finance Analytics team owns the definition; the registry records it.
#
# NOTE: this is the demo's key example of ONE logical identity with MULTIPLE
# Implementation Bindings on the SAME Snowflake stack — a native warehouse SQL UDF and a
# dbt macro that calls it. The registry treats them as the same governed definition, so
# reuse via dbt is not mistaken for duplication of the raw-SQL UDF.
apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: finance.logic.recognize_revenue.v1
  title: Recognize Revenue
  description: >
    Certified finance revenue-recognition rule: orders->invoices mapping plus the netting
    rule (gross minus refunds and credit notes). Currency-agnostic; reporting-currency
    conversion is applied by finance.logic.normalize_reporting_currency.v1.
  owner:
    team: finance-analytics
    escalation: finance-data-oncall
  lifecycle:
    state: certified
spec:
  entryRole: producer
  interfaceTypes:
    - callable_logic
  reuseIntent: domain_canonical
  # Implementation Bindings: physical objects that realize the logical identity,
  # plus the key used to attribute behavioral signals to this artifact.
  # ONE logical identity, TWO Snowflake-stack bindings: the native UDF, and a dbt macro that
  # calls it. dbt is the reuse surface *inside* dbt; resolve_binding returns the macro for a
  # dbt runtime and the UDF for a raw-warehouse runtime.
  implementationBindings:
    - system: warehouse
      env: prod
      objectType: udf
      dialect: snowflake
      ref: analytics.finance.fn_recognize_revenue
      attributionKey: "warehouse:snowflake:analytics.finance.fn_recognize_revenue"
    - system: dbt
      env: prod
      objectType: macro
      dialect: snowflake
      ref: dry_finance_macros.recognize_revenue
      attributionKey: "dbt:dry_finance_macros.recognize_revenue"
  compatibility:
    policy: backward-compatible
    breakingChanges:
      - orders_invoice_mapping_change
      - netting_rule_change
      - output_grain_or_column_change
  # Declared Dependencies: upstream artifacts, resolved to logical identities for impact analysis.
  dependencies:
    - fqn: finance.raw.orders.v1
      relationship: source_input
    - fqn: finance.raw.invoices.v1
      relationship: source_input
    - fqn: finance.raw.refunds.v1
      relationship: source_input
  knownConsumers:
    - fqn: finance.reporting.revenue_events.v1
      relationship: transformation_dependency
  sourceManifest: domains/finance/logic/finance.logic.recognize_revenue.v1.yaml
