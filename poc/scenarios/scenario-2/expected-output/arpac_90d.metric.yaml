# Semantic contract (governance manifest) — SCENARIO 2 generated output
#
# Registry FQN: enterprise.semantic.arpac_90d.v1
#
# This is the SECOND (and final) artifact the DRY Reuse agent authors in scenario 2: the certified
# ARPAC semantic contract, defined ON TOP OF the governed components dataset
# enterprise.datasets.customer_arpac_components_90d.v1. The ratio is the only genuinely new logic;
# every input measure is a resolved, certified binding recorded in the registry.
#
# This governance manifest is not a replacement for the tool-native (dbt/SQLMesh) metric; the
# `spec` section is illustrative. What it adds over dbt/SQLMesh: org-scoped fqn, lifecycle,
# cross-team registry enrollment, compatibility policy, and the explicit `reuses` provenance that
# ties the metric back to the certified cross-engine inputs it composes.
apiVersion: dry.platform/v1
kind: Metric
metadata:
  fqn: enterprise.semantic.arpac_90d.v1
  title: ARPAC (90-day Average Revenue Per Active Customer)
  description: >
    Certified enterprise KPI: trailing-90-day net recognized revenue from commercially active
    customers, divided by the count of commercially active customers. Composed entirely from
    resolved certified bindings — finance.logic.recognize_revenue.v1 (Snowflake) and
    sales.datasets.commercial_customer_status_90d.v1 (Databricks) — through the governed components
    dataset enterprise.datasets.customer_arpac_components_90d.v1.
  owner:
    team: enterprise-analytics
    escalation: enterprise-data-oncall
  lifecycle:
    state: certified # local | shared | certified | deprecated | retired
  registry:
    publish: true
    interfaceType: semantic_contract
spec:
  model: enterprise.datasets.customer_arpac_components_90d.v1
  type: ratio
  numerator:
    # Sum of recognized revenue for commercially active customers only.
    measure: net_recognized_revenue_90d_usd
    filter: is_active_commercial_90d = true
  denominator:
    # COUNT of customer_id where is_active_commercial_90d = true.
    measure: active_customer_count
  time:
    defaultGrain: day
  allowedDimensions:
    - reporting_date
  # Provenance: the certified artifacts this metric reuses instead of re-deriving.
  # resolve_binding returned the correct physical object per consuming engine.
  reuses:
    - fqn: finance.logic.recognize_revenue.v1
      binding: warehouse   # Snowflake UDF FINANCE.LOGIC.RECOGNIZE_REVENUE
    - fqn: sales.datasets.commercial_customer_status_90d.v1
      binding: databricks  # sales.datasets.commercial_customer_status_90d (Delta Share into Snowflake)
  compatibility:
    policy: backward-compatible
    deprecationWindowDays: 90
