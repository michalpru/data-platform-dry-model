fqn: exec.metrics.arpac_90d.v1
title: ARPAC (Trailing 90-Day Average Revenue per Active Customer)
interface_types:
  - callable_logic
governance:
  authority: PROPOSED
  lifecycle: proposed
  owner: executive-analytics
  reuse_intent: enterprise_canonical
description: >
  Reusable trailing-90-day ARPAC for executive reporting. Net recognized revenue (USD) over the
  trailing 90 days for the active-customer population, divided by the distinct count of active
  customers. Composes certified enterprise-canonical inputs; re-derives nothing. Intended to be
  adopted directly by other executive dashboards.

definition:
  formula: net_recognized_revenue_usd_90d / active_customers_90d
  grain: reporting_date
  window:
    kind: trailing
    days: 90
    bounds: "[reporting_date - 90, reporting_date]"
    note: >
      Numerator window is aligned to the active-customer definition's own 90-day lookback so the
      numerator and denominator populations use the same time boundaries.
  numerator:
    name: net_recognized_revenue_usd_90d
    description: >
      Sum of net recognized revenue in USD over the trailing 90 days, restricted to customers in
      the denominator (active customers). Revenue from non-active customers is excluded by
      construction in exec.datasets.arpac_components_90d.v1.
  denominator:
    name: active_customers_90d
    description: >
      Distinct count of active customers at the reporting date, per the enterprise active-customer
      definition used by executive dashboards (is_active_commercial_90d = TRUE).
  empty_population: >
    When active_customers_90d = 0 the metric returns 0 (DIV0 guard) rather than erroring.

outputs:
  - name: reporting_date
    type: date
  - name: net_recognized_revenue_usd_90d
    type: number(18,2)
  - name: active_customers_90d
    type: number(38,0)
  - name: arpac_90d_usd
    type: number(18,2)

bindings:
  - ref: EXEC.METRICS.ARPAC_90D
    system: warehouse
    env: prod
    runtime: warehouse
    dialect: snowflake
    object_type: udf
    source_path: exec/metrics/arpac_90d.sql

dependencies:
  - fqn: exec.datasets.arpac_components_90d.v1
    relationship: source_input

reuses:
  - fqn: finance.logic.recognize_revenue.v1
    role: numerator
    what: Net recognized revenue in USD (refunds netted); called for the trailing-90-day window.
    authority: REGISTERED_CANONICAL
    lifecycle: certified
    reuse_intent: enterprise_canonical
    resolved_binding:
      ref: FINANCE.LOGIC.RECOGNIZE_REVENUE
      runtime: warehouse
      dialect: snowflake
      object_type: udf
  - fqn: sales.datasets.commercial_customer_status_90d.v1
    role: denominator
    what: Enterprise active-customer definition used by executive dashboards (is_active_commercial_90d).
    authority: REGISTERED_CANONICAL
    lifecycle: certified
    reuse_intent: enterprise_canonical
    resolved_binding:
      ref: sales.datasets.commercial_customer_status_90d
      runtime: databricks
      dialect: databricks
      object_type: view

integration_gaps:
  - type: missing_target_engine_binding
    artifact: sales.datasets.commercial_customer_status_90d.v1
    authored_on: snowflake
    bound_to:
      - databricks
    detail: >
      The certified active-customer definition resolves only to a Databricks binding; there is no
      Snowflake binding. This composition is authored on Snowflake (where the certified revenue rule
      is bound) and references the active-customer artifact under an explicit reachability
      precondition. To run, provision a Snowflake-reachable binding for the same artifact -- e.g. via
      the portable-SQL framework, or a shared/federated view registered in the registry as an
      ADDITIONAL Snowflake binding. No bridge object was fabricated.
