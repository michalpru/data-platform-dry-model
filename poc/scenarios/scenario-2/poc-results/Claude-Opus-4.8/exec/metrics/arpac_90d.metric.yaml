apiVersion: dry.platform/v1
kind: Metric
metadata:
  fqn: exec.metrics.arpac_90d.v1
  title: ARPAC (Average Revenue per Active Customer, trailing 90d)
  description: >
    Executive KPI. Trailing-90d net recognized revenue in USD from active customers, divided by the
    number of active customers. Numerator counts ONLY revenue from the denominator population.
    Reusable across executive dashboards.
  owner:
    team: exec-analytics
    escalation: exec-reporting-oncall
  lifecycle:
    state: local # newly authored; promote to shared/certified after owner review (not self-certified)
  registry:
    publish: true
    interfaceType: semantic_contract
spec:
  model: exec.semantic.arpac_components.v1
  type: ratio
  numerator:
    measure: net_recognized_revenue_usd_90d # certified recognized-revenue rule, active customers only
  denominator:
    measure: active_customers_90d           # certified active-customer definition (distinct count)
  time:
    defaultGrain: day
    trailingWindowDays: 90
  allowedDimensions:
    - reporting_date
  implementation:
    runtime: warehouse
    dialect: snowflake
    source: ../metrics/arpac_90d.sql
  compatibility:
    policy: backward-compatible
    deprecationWindowDays: 90

  # Provenance: both components are RESOLVED registry bindings, not re-derivations.
  reuses:
    - fqn: finance.logic.recognize_revenue.v1
      role: numerator
      lifecycle: certified
      reuseIntent: enterprise_canonical
      via: exec.reporting.arpac_active_customer_revenue_90d.v1
    - fqn: sales.datasets.commercial_customer_status_90d.v1
      role: denominator
      lifecycle: certified
      reuseIntent: enterprise_canonical
      via: exec.reporting.arpac_active_customer_revenue_90d.v1

  crossEngineGaps:
    - artifact: sales.datasets.commercial_customer_status_90d.v1
      status: missing_target_binding
      requestedRuntime: warehouse
      boundOn: [databricks]
      detail: >
        The certified active-customer definition has no warehouse/snowflake binding. This metric is
        runnable on snowflake the moment a warehouse binding is provisioned under the same FQN
        (portable-SQL materialization or a federated/shared view registered as an additional
        binding). No bridge object is fabricated. See the components dataset manifest for details.
