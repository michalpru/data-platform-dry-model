apiVersion: dry.platform/v1
kind: SemanticModel
metadata:
  fqn: finance.semantic.arpac_components.v1
  title: "ARPAC Components Semantic Model"
  description: >
    Semantic model over finance.reporting.arpac_components.v1.
    Exposes the two measures required to compute trailing-90-day ARPAC:
      - active_customer_count  (ARPAC denominator)
      - net_recognized_revenue_usd  (ARPAC numerator)
    The ARPAC metric (finance.metrics.arpac_trailing_90d.v1) references
    these measures as a ratio: net_recognized_revenue_usd / active_customer_count.
  owner:
    team: finance-analytics
    escalation: finance-data-oncall
  lifecycle:
    state: certified
  registry:
    publish: true
    interfaceType: semantic_contract

spec:
  entity:
    name: ActiveCustomerRevenueContribution
    grain:
      - customer_id
      - reporting_date
  sourceDataset: finance.reporting.arpac_components.v1
  dimensions:
    - name: reporting_date
      type: date
      description: "As-of date for the trailing 90-day window."
    - name: customer_id
      type: number
      description: "Canonical customer identifier; one row per active customer per reporting_date."
  measures:
    - name: active_customer_count
      type: count
      expr: customer_id
      description: >
        Count of active customers in the trailing 90-day window for the given reporting_date.
        Aligns with the enterprise active-customer definition from
        sales.datasets.commercial_customer_status_90d.v1 (is_active_commercial_90d = TRUE).
    - name: net_recognized_revenue_usd
      type: sum
      expr: net_recognized_revenue_usd
      description: >
        Total net recognized revenue in USD from active customers in the trailing 90-day window.
        Sourced from finance.logic.recognize_revenue.v1; refund netting is applied upstream.
        Revenue from non-active customers is excluded by the components dataset.
  compatibility:
    policy: backward-compatible
    deprecationWindowDays: 90
