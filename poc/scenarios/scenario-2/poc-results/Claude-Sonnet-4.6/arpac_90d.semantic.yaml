artifact:
  fqn: exec.metrics.arpac_90d.v1
  title: "ARPAC — Average Revenue per Active Customer (Trailing 90 Days)"
  description: >
    Executive metric: net recognized revenue (USD) earned from active customers over
    the trailing 90 days, divided by the count of distinct active customers. Both
    numerator and denominator use the same certified active-customer population, so
    revenue from non-active customers is structurally excluded. Designed for reuse by
    executive dashboards that need a standardized, governed ARPAC signal.
  interface_types:
    - queryable_dataset
  governance:
    authority: REGISTERED_CANONICAL
    lifecycle: draft        # promote to certified after bindings are validated in prod
    owner: exec-reporting
    reuse_intent: enterprise_canonical

bindings:
  - ref: exec.metrics.arpac_90d
    system: warehouse
    env: prod
    runtime: warehouse
    dialect: snowflake
    object_type: view
    source_path: exec/metrics/arpac_90d.sql

  - ref: exec.datasets.arpac_components_90d
    system: warehouse
    env: prod
    runtime: warehouse
    dialect: snowflake
    object_type: view
    source_path: exec/datasets/arpac_components_90d.sql

metric_definition:
  name: ARPAC_USD
  label: "Average Revenue per Active Customer (USD, trailing 90 days)"
  formula: "SUM(NET_REVENUE_USD) / COUNT(DISTINCT CUSTOMER_ID)"
  null_on_zero_denominator: true
  window: trailing_90_days
  grain: reporting_date
  output_columns:
    - name: REPORTING_DATE
      description: The date as of which active-customer status and revenue window are evaluated.
    - name: NET_REVENUE_USD_TRAILING_90D
      description: Total net recognized revenue (USD) from active customers over the trailing 90 days.
    - name: ACTIVE_CUSTOMER_COUNT
      description: Count of distinct active customers per the enterprise active-customer definition.
    - name: ARPAC_USD
      description: ARPAC in USD; NULL when ACTIVE_CUSTOMER_COUNT = 0.

numerator:
  description: >
    Net recognized revenue (USD) summed across active customers for the 90-day
    window [REPORTING_DATE - 89 days, REPORTING_DATE]. Revenue from non-active
    customers is excluded by design: the components dataset joins the revenue
    function against the active-customer set before aggregating.
  reuses:
    artifact_fqn: finance.logic.recognize_revenue.v1
    governance: "certified | enterprise_canonical"
    binding_used: "warehouse:snowflake:FINANCE.LOGIC.RECOGNIZE_REVENUE"
    binding_object_type: udf
    note: >
      Certified Finance-owned UDF. Consumers MUST use this instead of re-deriving
      revenue from raw invoices or refunds. UDF call signature is UNCONFIRMED —
      confirm from finance/logic/recognize_revenue.sql before promotion.

denominator:
  description: >
    Count of distinct customers where IS_ACTIVE_COMMERCIAL_90D = TRUE as of each
    REPORTING_DATE. Uses the same enterprise active-customer definition as other
    executive dashboards.
  reuses:
    artifact_fqn: sales.datasets.commercial_customer_status_90d.v1
    governance: "certified | enterprise_canonical"
    binding_used: "databricks:sales.datasets.commercial_customer_status_90d"
    binding_object_type: view

cross_engine_gaps:
  - artifact_fqn: sales.datasets.commercial_customer_status_90d.v1
    title: "Commercial Customer Status (90d)"
    issue: >
      This certified enterprise_canonical artifact has NO registered Snowflake
      (warehouse) binding. Only a Databricks binding exists. The components dataset
      (arpac_components_90d.sql) references the Databricks binding name with an
      explicit reachability precondition. This metric cannot run end-to-end in the
      Snowflake warehouse environment until a Snowflake binding is provisioned.
    resolution_required: >
      Provision a Snowflake-reachable object (e.g. External Table over the
      Databricks-served data, a Snowflake Secure Data Share, or a Snowflake view
      registered as an additional binding) and register it as a binding for
      sales.datasets.commercial_customer_status_90d.v1 with:
        runtime: warehouse
        dialect: snowflake
      File the registration request with sales-analytics and platform-dwh.
    affects: [arpac_components_90d.sql, arpac_90d_metric.sql]

unconfirmed_identifiers:
  - artifact_fqn: sales.datasets.commercial_customer_status_90d.v1
    reason: Source file sales/datasets/commercial_customer_status_90d.sql is not readable from workspace.
    identifiers:
      - CUSTOMER_ID         # assumed customer key; confirm actual column name
      - REPORTING_DATE      # assumed date grain column; confirm actual column name
      - IS_ACTIVE_COMMERCIAL_90D  # assumed status flag; confirm actual column name
  - artifact_fqn: finance.logic.recognize_revenue.v1
    reason: Source file finance/logic/recognize_revenue.sql is not readable from workspace.
    identifiers:
      - "FINANCE.LOGIC.RECOGNIZE_REVENUE — parameter 1: assumed CUSTOMER_ID"
      - "FINANCE.LOGIC.RECOGNIZE_REVENUE — parameter 2: assumed WINDOW_START (DATE)"
      - "FINANCE.LOGIC.RECOGNIZE_REVENUE — parameter 3: assumed WINDOW_END (DATE)"
      - "FINANCE.LOGIC.RECOGNIZE_REVENUE — return type: assumed scalar NUMBER (net_revenue_usd)"

components_lineage:
  - fqn: exec.datasets.arpac_components_90d.v1
    role: intermediate_components_dataset
    grain: "CUSTOMER_ID x REPORTING_DATE"
    description: >
      Joins the active-customer set with per-customer net recognized revenue for the
      trailing 90-day window. The join ensures the numerator counts only revenue from
      the active-customer population that forms the denominator.
    source_path: exec/datasets/arpac_components_90d.sql

reuse_summary:
  total_components: 3
  reused_from_registry: 3
  genuinely_new: 0
  authored: 2  # arpac_components_90d (composition join) + arpac_90d (metric ratio)
  what_was_reused:
    - artifact: sales.datasets.commercial_customer_status_90d.v1
      why: >
        This is THE certified enterprise active-customer definition used by all
        executive dashboards. Using it for both denominator (active customer count)
        and the customer filter on the numerator (active-customer revenue only)
        ensures definitional alignment across the enterprise.
    - artifact: finance.logic.recognize_revenue.v1
      why: >
        Certified Finance-owned revenue-recognition rule. Encapsulates the recognition
        timing, refund netting, and USD normalization logic. Consumers must not
        re-implement this from raw invoices/refunds.
  what_was_not_reused:
    - artifact: finance.datasets.invoice_revenue.v1
      reason: >
        RETIRED lifecycle. Superseded by the certified recognized-revenue path.
        The registry description explicitly states "do NOT reuse."
    - artifact: shared.datasets.dim_customers.v1
      reason: >
        Its IS_ACTIVE flag is a 12-month order-activity flag that is explicitly NOT
        the certified executive active-customer definition per the registry description.
        Using it would produce a different (non-executive-aligned) denominator.
