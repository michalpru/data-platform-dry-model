version: 1

artifact:
  fqn: executive.metrics.arpac_trailing_90d.v1
  title: Trailing 90 Day ARPAC
  interface_type: metric
  lifecycle: proposed
  owner: executive-analytics
  description: >
    Average Revenue per Active Customer for executive reporting. The metric divides
    trailing-90-day net recognized revenue in USD by the distinct count of active
    customers, excluding revenue from customers outside the active-customer denominator.

metric:
  name: arpac_usd_trailing_90d
  grain:
    - reporting_date
  measure_column: arpac_usd_trailing_90d
  numerator:
    column: net_recognized_revenue_usd_90d
    definition: >
      Sum of recognized_revenue_usd over the trailing 90 days from the certified
      finance revenue-recognition relation, inner-joined to the active-customer
      denominator before aggregation.
  denominator:
    column: active_customer_count
    definition: >
      COUNT DISTINCT customer_id from the certified executive-dashboard active-customer
      status where is_active_commercial_90d is true for the reporting date.
  expression: net_recognized_revenue_usd_90d / NULLIF(active_customer_count, 0)
  window:
    type: trailing
    length: 90
    date_column: recognition_date
    inclusive_end: true

component_dataset:
  path: arpac_trailing_90d_components.sql
  runtime: dbt
  dialect: snowflake
  materialization: view
  report_date_parameter:
    name: arpac_reporting_date
    default_sql_expression: CURRENT_DATE
    accepted_format: >
      SQL expression accepted by TO_DATE, for example CURRENT_DATE or '2026-08-15'.

reuses:
  - artifact_fqn: sales.datasets.commercial_customer_status_90d.v1
    title: Commercial Customer Status (90d)
    purpose: Certified executive-dashboard active-customer denominator.
    binding:
      ref: sales.datasets.commercial_customer_status_90d
      runtime: databricks
      dialect: databricks
      object_type: view
      source_path: poc/scenarios/scenario-2/workspace/sales/datasets/commercial_customer_status_90d.sql
    confirmed_interface:
      columns:
        - customer_id
        - reporting_date
        - is_active_commercial_90d
  - artifact_fqn: finance.logic.recognize_revenue.v1
    title: Recognize Revenue
    purpose: Certified net recognized revenue in USD numerator logic.
    binding:
      ref: dry_finance_macros.recognized_revenue_relation
      runtime: dbt
      dialect: snowflake
      object_type: macro
      source_path: poc/scenarios/scenario-2/workspace/finance/logic/dbt/recognized_revenue_relation.sql
    confirmed_interface:
      signature: recognized_revenue_relation(start_date_expression, end_date_expression)
      output_columns:
        - customer_id
        - billable_event_id
        - recognition_date
        - event_type
        - source_currency
        - recognized_revenue_usd

preconditions:
  - >
    The certified Databricks active-customer binding sales.datasets.commercial_customer_status_90d
    must be reachable from the dbt/Snowflake execution environment, or an additional
    registry binding for dbt/Snowflake must be provisioned. No unregistered bridge object
    is assumed by this metric definition.
  - >
    The dbt project must install the dry_finance_macros package that exposes
    recognized_revenue_relation and its registered dependencies.

quality_checks:
  - active_customer_count >= 0
  - arpac_usd_trailing_90d is null when active_customer_count = 0
  - net_recognized_revenue_usd_90d includes only customer_id values present in the active_customer_count denominator