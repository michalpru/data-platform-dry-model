metric:
  name: arpac_trailing_90d_usd
  title: Trailing 90 Day Average Revenue per Active Customer
  description: >
    Executive ARPAC metric equal to trailing-90-day net recognized revenue in USD from active
    customers divided by the distinct count of active customers on the reporting date.
  owner: executive-analytics
  grain:
    - reporting_date
  type: ratio
  numerator:
    name: numerator_net_recognized_revenue_usd_90d
    definition: >
      Sum of certified net recognized revenue in USD over the trailing 90 days, restricted to
      customers in the active-customer denominator.
  denominator:
    name: denominator_active_customers
    definition: >
      Distinct count of customers where the certified executive active-customer status is true
      on the reporting date.
  expression: numerator_net_recognized_revenue_usd_90d / nullif(denominator_active_customers, 0)
  components_dataset: arpac_trailing_90d_components.sql
  reuses:
    - artifact: sales.datasets.commercial_customer_status_90d.v1
      binding: sales.datasets.commercial_customer_status_90d
      runtime: databricks
      dialect: databricks
      role: denominator active-customer definition
      lifecycle: certified
      owner: sales-analytics
    - artifact: finance.logic.recognize_revenue.v1
      binding: dry_finance_macros.recognized_revenue_relation
      runtime: dbt
      dialect: snowflake
      role: numerator net recognized revenue in USD
      lifecycle: certified
      owner: finance-analytics
  exclusions:
    - Revenue from customers not present in the active-customer denominator is excluded.
    - Retired legacy invoice revenue is not reused.
  source_contract_status:
    active_customer_status_source_path: sales/datasets/commercial_customer_status_90d.sql
    recognized_revenue_source_path: finance/logic/dbt/recognized_revenue_relation.sql
    status: source files were not readable from the workspace paths attempted; identifiers marked UNCONFIRMED in SQL
  integration_preconditions:
    - The certified Databricks active-customer binding must be reachable from the execution engine.
    - The dbt recognized-revenue macro signature and output columns must be confirmed from its registered source contract before production promotion.