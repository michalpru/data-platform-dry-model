# DRY Artifact manifest (registry = logical metadata index; no code stored here).
apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: shared.datasets.fact_refunds.v1
  title: Refund Facts
  description: >
    Approved refunds and credit notes associated with customer billing activity, in the shared
    data warehouse. Consumed by the canonical billable-event stream to net revenue.
  owner:
    team: platform-dwh
    escalation: dwh-data-oncall
  lifecycle:
    state: certified
spec:
  entryRole: producer
  interfaceTypes:
    - queryable_dataset
  reuseIntent: shared_utility
  implementationBindings:
    - system: warehouse
      env: prod
      objectType: table
      dialect: snowflake
      ref: SHARED.DATASETS.FACT_REFUNDS
      attributionKey: "warehouse:snowflake:SHARED.DATASETS.FACT_REFUNDS"
      source: dwh/shared/datasets/fact_refunds.sql
  compatibility:
    policy: backward-compatible
  dependencies: []
  knownConsumers:
    - fqn: finance.datasets.fact_billable_events.v1
      relationship: source_input
