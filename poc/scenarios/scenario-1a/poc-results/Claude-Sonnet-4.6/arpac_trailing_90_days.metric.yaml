metric: arpac_trailing_90_days_usd
display_name: Trailing-90-Day ARPAC (USD)
description: >
  Average Revenue per Active Customer over the trailing 90 days, denominated in USD.
  Intended for executive dashboards that require a standardised ARPAC definition
  they can adopt by consuming shared.metric_arpac_trailing_90_days directly.

grain: one row per metric_date (CURRENT_DATE at query time)

formula: net_recognized_revenue_usd / active_customer_count

window:
  type: trailing
  length_days: 90
  anchor: CURRENT_DATE()

numerator:
  name: net_recognized_revenue_usd
  description: >
    Gross posted USD invoice revenue minus approved USD refunds over the trailing
    90 days. Restricted to customers in the active-customer denominator; revenue
    from non-active customers is excluded.
  sources:
    - table: shared.fact_invoices
      role: gross_revenue
      filters:
        - invoice_status = 'POSTED'
        - currency_code = 'USD'
        - invoice_date >= DATEADD('day', -90, CURRENT_DATE())
    - table: shared.fact_refunds
      role: contra_revenue
      join: fact_refunds.invoice_id = fact_invoices.invoice_id
      filters:
        - refund_status = 'APPROVED'
        - currency_code = 'USD'
        - (invoice_date of parent invoice) >= DATEADD('day', -90, CURRENT_DATE())
  customer_scope: restricted to active_customer_denominator

denominator:
  name: active_customer_count
  description: >
    COUNT(DISTINCT customer_id) from shared.dim_customers where is_active = TRUE.
    Reuses the active-customer definition already in use by executive dashboards in
    this workspace: a customer who placed at least one order in the last 12 months.
  source: shared.dim_customers
  filter: is_active = TRUE
  aggregation: COUNT(DISTINCT customer_id)

dependencies:
  - shared.dim_customers
  - shared.fact_invoices
  - shared.fact_refunds

output:
  sql_file: arpac_trailing_90_days.sql
  view_name: shared.metric_arpac_trailing_90_days
  columns:
    - name: metric_date
      type: DATE
      description: Date the metric was computed (CURRENT_DATE at query time).
    - name: active_customer_count
      type: NUMBER
      description: Denominator — distinct active customers.
    - name: net_recognized_revenue_usd
      type: NUMBER(18,2)
      description: Numerator — net USD revenue over the trailing 90 days.
    - name: arpac_trailing_90_days_usd
      type: NUMBER(18,2)
      description: ARPAC = net_recognized_revenue_usd / active_customer_count. NULL when active_customer_count = 0.

reuse_notes:
  - dim_customers.is_active reused as the active-customer definition aligned with executive dashboards (12-month order activity flag).
  - fact_invoices reused as the revenue source; POSTED status treated as recognized revenue, matching shared schema convention.
  - fact_refunds reused as contra-revenue; APPROVED status treated as recognised refund, joined via invoice_id.
  - No new logic is introduced for active-customer classification or revenue recognition.

assumptions:
  - USD-only scope enforced via currency_code = 'USD' on both invoices and refunds; no FX conversion table is present in this workspace.
  - Refund customer attribution is resolved through fact_refunds.invoice_id -> fact_invoices.customer_id.
  - The metric returns NULL (not 0) for ARPAC when there are zero active customers to avoid misleading zero values.
  - Customers with no invoices in the trailing 90 days contribute 0 to the numerator but are counted in the denominator, correctly diluting ARPAC.
