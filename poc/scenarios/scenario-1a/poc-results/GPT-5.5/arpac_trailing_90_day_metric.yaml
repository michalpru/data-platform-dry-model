metric:
  name: arpac_trailing_90_day
  display_name: Trailing 90 Day ARPAC
  description: Average Revenue per Active Customer over the trailing 90 days for executive reporting.
  grain: executive_reporting_period
  owner: executive_analytics
  type: ratio
  unit: USD per active customer
  time_window:
    type: trailing
    length: 90
    unit: day
    anchor_date_parameter: as_of_date
  numerator:
    name: net_recognized_revenue_usd_trailing_90_day_active_customers
    description: Posted invoice revenue less approved refunds in USD over the trailing 90 days, restricted to customers in the active-customer denominator.
    expression: net_recognized_revenue_usd
    filters:
      - invoice_status = 'POSTED'
      - refund_status = 'APPROVED'
      - currency_code = 'USD'
      - revenue customer_id is in active_customers denominator set
  denominator:
    name: active_customers
    description: Distinct count of active customers aligned to the shared executive active-customer definition.
    expression: COUNT(DISTINCT customer_id)
    source_definition: shared.dim_customers.is_active = TRUE
  calculation:
    expression: numerator / NULLIF(denominator, 0)
    null_handling: Returns NULL when there are no active customers.
  reusable_sources:
    - name: shared.dim_customers
      reused_fields:
        - customer_id
        - is_active
      reuse_reason: Reuses the active-customer definition already materialized on the shared customer dimension.
    - name: shared.fact_invoices
      reused_fields:
        - invoice_id
        - customer_id
        - invoice_date
        - invoice_status
        - invoice_amount
        - currency_code
      reuse_reason: Reuses shared invoice facts as recognized gross revenue events.
    - name: shared.fact_refunds
      reused_fields:
        - invoice_id
        - refund_date
        - refund_status
        - refund_amount
        - currency_code
      reuse_reason: Reuses shared refund facts as contra-revenue events tied back to invoices.
  semantic_contract:
    active_customer_definition: Customer has shared.dim_customers.is_active = TRUE; the source column documents this as placed at least one order in the last 12 months.
    recognized_invoice_revenue: Invoice rows with invoice_status = 'POSTED'.
    recognized_refunds: Refund rows with refund_status = 'APPROVED'.
    currency: USD only, enforced by currency_code = 'USD' on invoice and refund sources.
    customer_scope: Numerator includes only revenue associated with customers present in the active-customer denominator.
  adoption_guidance:
    dashboard_use: Executive dashboards should consume this metric rather than redefining ARPAC locally.
    required_parameter: as_of_date
    default_anchor: CURRENT_DATE
