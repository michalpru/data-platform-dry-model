# Registered callable_logic artifact — platform-owned Python utility package.
# Registered by: data-platform team on publishing v0.1.0 to internal PyPI.
# Source: platform/packages/python/dry_platform_utils/
#
# This entry demonstrates that the DRY Artifact Registry covers ALL three interface
# types (callable_logic, queryable_dataset, semantic_contract), not only datasets.
# Callable logic artifacts are registered so that:
#   - domain teams can discover what is already provided before writing new helpers
#   - CI duplication detection can flag re-implementations of packaged utilities
#   - impact analysis knows which domain transformations depend on which package versions

apiVersion: dry.platform/v1
kind: DryArtifact
metadata:
  fqn: platform.callable.dry_platform_utils.v1
  title: DRY Platform Utils (Python)
  description: >
    Platform-published Python utility package providing business-agnostic ingestion and transformation
    helpers. Domain teams declare a versioned pip dependency — they do not copy the source.

    Currently exposes:
      - dry_platform_utils.ingestion.ingest_rest_pages
        Reusable REST ingestion loop for pagination, retry, response extraction, and error classification.
        Domains inject source-specific endpoints, token providers, record extractors, and error classifiers.
        Consumed by: finance.ingestion.ingest_billing_api, marketing.ingestion.ingest_campaign_api
      - dry_platform_utils.transforms.flags.with_boolean_flag
        Attaches a boolean flag column based on a condition.
        Encodes *how* to compute a flag, not *what* the flag means.
        Consumed by: finance.reporting.revenue_events.v1, marketing.reporting.active_customers_30d.v1

    Corresponds to the "DRY in Code" layer: technical utilities that are business-agnostic
    and reusable across any domain that runs PySpark/Snowpark/pandas transformations.
  owner:
    team: data-platform
    escalation: platform-oncall
  lifecycle:
    state: shared
    sharedSince: "2025-01"

spec:
  entryRole: producer
  reuseIntent: shared_utility
  interfaceTypes:
    - callable_logic
  distribution:
    type: python_wheel
    registry: internal-pypi
    package: dry-platform-utils
    currentVersion: "0.1.0"
    installExample: "dry-platform-utils>=0.1.0,<1.0.0"
  compatibility:
    policy: semver
    note: >
      Patch versions (0.1.x) are bug fixes — backward-compatible.
      Minor versions (0.x.0) add new utilities — backward-compatible.
      Major versions (x.0.0) may contain breaking signature changes — require domain migration.
  knownConsumers:
    - fqn: finance.ingestion.billing_api.v1
      relationship: callable_logic_dependency
    - fqn: marketing.ingestion.campaign_api.v1
      relationship: callable_logic_dependency
    - fqn: finance.reporting.revenue_events.v1
      relationship: transformation_dependency
    - fqn: marketing.reporting.active_customers_30d.v1
      relationship: transformation_dependency
  sourceManifest: platform/packages/python/dry_platform_utils/pyproject.toml
