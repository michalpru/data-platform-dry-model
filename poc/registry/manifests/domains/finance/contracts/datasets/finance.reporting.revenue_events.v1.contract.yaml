apiVersion: dry.platform/v1
kind: DatasetContract
metadata:
  fqn: finance.reporting.revenue_events.v1
  owner:
    team: finance-analytics
  lifecycle:
    state: certified
  registry:
    publish: true
    interfaceType: queryable_dataset
spec:
  grain:
    - revenue_event_id
  dependencies:
    - fqn: enterprise.reporting.customer.v1
      relationship: joins_on_customer_id
  slos:
    freshnessMinutes: 180
  schema:
    - name: revenue_event_id
      type: string
      nullable: false
    - name: customer_id
      type: string
      nullable: false
    - name: amount
      type: decimal(18,2)
      nullable: false
  semanticNotes:
    definitions:
      amount: "Recognized revenue amount in reporting currency."
