# Source manifest (declaration layer) — finance-owned SQL macro.
# Declared in the finance domain repo; CI promotes it to
# platform/registry/registered/finance.logic.normalize_reporting_currency.v1.yaml on merge.

apiVersion: dry.platform/v1
kind: ReusableLogic
metadata:
  fqn: finance.logic.normalize_reporting_currency.v1
  title: Normalize Reporting Currency
  description: >
    Currency rule: convert an amount from its source currency to the enterprise reporting
    currency using the daily FX rate effective on the event date. Centralizes the FX table,
    join grain, and rounding convention so teams do not hardcode divergent currency logic.
  owner:
    team: finance-analytics
    escalation: finance-data-oncall
  lifecycle:
    state: shared
    sharedSince: "2025-06"
  registry:
    publish: true
    interfaceType: callable_logic
spec:
  dryLayer:
    - code
    - logic
  implementation:
    language: sql
    framework: dbt
    package: dry_finance_macros
    symbol: normalize_reporting_currency
    source: domains/finance/logic/macros/finance.logic.normalize_reporting_currency.v1.sql
  compatibility:
    policy: backward-compatible
    deprecationWindowDays: 90
    breakingChanges:
      - fx_source_table_change
      - rounding_convention_change
      - default_reporting_currency_change
  dependencies:
    declared:
      - fqn: finance.raw.fx_rates.v1
        relationship: source_input
  usage:
    intendedConsumers:
      - finance.reporting.revenue_events.v1
    antiPatterns:
      - hardcoding_fx_rates_in_domain_models
      - joining_a_local_copy_of_fx_rates
  links:
    docs: ./README.md
