# Source manifest (declaration layer) — sales-owned queryable dataset.
# Declared in the sales domain repo; CI promotes it to
# registered/sales.datasets.commercial_customer_status_90d.v1.yaml on merge.
apiVersion: dry.platform/v1
kind: DatasetContract
metadata:
  fqn: sales.datasets.commercial_customer_status_90d.v1
  title: Commercial Customer Status (90d)
  description: >
    Sales-owned, enterprise-certified commercial-activity classification. Evaluates activity
    at customer x reporting-date grain; exposes the authoritative is_active_commercial_90d flag.
  owner:
    team: sales-analytics
    escalation: sales-data-oncall
  lifecycle:
    state: certified
    certifiedSince: "2025-06"
  registry:
    publish: true
    interfaceType: queryable_dataset
spec:
  grain:
    - customer_id
    - reporting_date
  # Single Implementation Binding: a Databricks (Spark SQL) view. The registry resolves this
  # for a databricks runtime; the source below lets the reuse-detection engine compare code.
  implementation:
    binding: databricks-view
    language: sql
    framework: databricks
    objectType: view
    physicalRef: sales.datasets.commercial_customer_status_90d
    source: domains/sales/datasets/sales.datasets.commercial_customer_status_90d.v1.sql
  dependencies:
    - fqn: shared.datasets.dim_customers.v1
      relationship: source_input
  slos:
    freshnessMinutes: 1440
  schema:
    - name: customer_id
      type: string
      nullable: false
    - name: reporting_date
      type: date
      nullable: false
    - name: is_active_commercial_90d
      type: boolean
      nullable: false
  semanticNotes:
    definitions:
      is_active_commercial_90d: >
        True when the customer has a qualifying commercial event (paid invoice, active
        subscription, or committed order) within the trailing 90 days as of reporting_date.
