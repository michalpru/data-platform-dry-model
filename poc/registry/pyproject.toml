[project]
name = "dry-registry"
version = "0.1.0"
description = "Minimal local DRY Artifact Registry control plane for the duplication-detection PoC."
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
]

# Optional tiers. The PoC runs fully offline with ZERO optional deps:
#   - AST/structural similarity uses the Python stdlib (ast, difflib).
#   - SQL normalization uses sqlglot when present and falls back to a regex
#     normalizer when it is not.
[project.optional-dependencies]
# Better SQL AST normalization (recommended, still fully offline).
sql = ["sqlglot>=25.0"]
# Optional local vector-similarity tier for Pattern 2's "3 models" comparison.
# Fully offline once the model is downloaded once; no API keys.
vector = [
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
]

[project.scripts]
dry-registry = "dry_registry.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dry_registry"]
