project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - publications/whitepaper-data-platform-dry-model.md
  resources:
    - publications/assets-diagrams/**

website:
  title: "The Data Platform DRY Model"
  description: "Evaluating and Operationalizing Reuse at Scale"
  site-url: https://michalpru.github.io/data-platform-dry-model/
  repo-url: https://github.com/michalpru/data-platform-dry-model
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    background: dark
    pinned: true
    title: "The Data Platform DRY Model"
    right:
      - icon: github
        href: https://github.com/michalpru/data-platform-dry-model
        aria-label: GitHub repository
  page-footer:
    center: "The Data Platform DRY Model · Evaluating and Operationalizing Reuse at Scale"

format:
  html:
    theme:
      - cosmo
      - theme.scss
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <meta property="og:type" content="article">
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    toc-location: left
    number-sections: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true
    code-copy: true
    code-overflow: wrap
    fig-responsive: true
    grid:
      sidebar-width: 270px
      body-width: 1240px
      margin-width: 80px
      gutter-width: 1.5rem
    mermaid:
      theme: neutral
